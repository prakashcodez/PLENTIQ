{% extends "base.html" %}

{% block title %}Page Not Found | Plentiq{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 40px auto; text-align: center;">
    <div class="panel">
        <div style="font-size: 56px; margin-bottom: 12px;">🔍</div>
        <h2 style="color: var(--primary); margin-bottom: 12px;">404 - Page Not Found</h2>
        <p style="color: var(--text-secondary); margin-bottom: 24px;">
            The requested page does not exist or has been moved.
        </p>
        <div style="display: flex; gap: 12px; justify-content: center;">
            <a href="{{ url_for('home') }}" class="btn btn-primary">Return to Home</a>
            <a href="{{ url_for('listings') }}" class="btn btn-secondary">Browse Listings</a>
        </div>
    </div>
</div>
{% endblock %}
