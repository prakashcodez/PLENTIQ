{% extends "base.html" %}

{% block title %}Edit Food Listing #{{ listing.listing_id }} | Plentiq{% endblock %}

{% block content %}
<div class="panel-header" style="margin-bottom: 24px;">
    <div>
        <h2>Edit Food Listing #{{ listing.listing_id }}</h2>
        <p>Update surplus food details, availability or status</p>
    </div>
    <a href="{{ url_for('donations') }}" class="btn btn-secondary btn-sm">← Back to Donations</a>
</div>

<section class="panel">
    <form method="POST" action="{{ url_for('edit_listing', listing_id=listing.listing_id) }}">
        <div class="form-grid">

            <div class="field">
                <label for="food_name">Food Name *</label>
                <input
                    id="food_name"
                    name="food_name"
                    required
                    maxlength="120"
                    value="{{ listing.food_name }}"
                >
            </div>

            <div class="field">
                <label for="category_id">Food Category *</label>
                <select id="category_id" name="category_id" required>
                    {% for cat in categories %}
                        <option value="{{ cat.category_id }}" {% if cat.category_id == listing.category_id %}selected{% endif %}>
                            {{ cat.category_name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label for="source_type">Food Source *</label>
                <select id="source_type" name="source_type" required>
                    {% for src in ['Hotel', 'Restaurant', 'Wedding/Function', 'Catering Service', 'College/Office Event', 'Community Event', 'Other'] %}
                        <option value="{{ src }}" {% if src == listing.source_type %}selected{% endif %}>{{ src }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label for="quantity_available">Available Quantity * (Total: {{ listing.quantity_total }} {{ listing.unit }})</label>
                <input
                    id="quantity_available"
                    name="quantity_available"
                    type="number"
                    min="0"
                    max="{{ listing.quantity_total }}"
                    step="0.01"
                    required
                    value="{{ listing.quantity_available }}"
                >
            </div>

            <div class="field">
                <label for="status">Listing Status *</label>
                <select id="status" name="status" required>
                    <option value="available" {% if listing.status == 'available' %}selected{% endif %}>Available</option>
                    <option value="fully_allocated" {% if listing.status == 'fully_allocated' %}selected{% endif %}>Fully Allocated</option>
                    <option value="expired" {% if listing.status == 'expired' %}selected{% endif %}>Expired</option>
                    <option value="cancelled" {% if listing.status == 'cancelled' %}selected{% endif %}>Cancelled</option>
                </select>
            </div>

            <div class="field">
                <label for="expiry_at">Safe Expiry Date &amp; Time *</label>
                <input
                    id="expiry_at"
                    name="expiry_at"
                    type="datetime-local"
                    min="{{ min_expiry }}"
                    required
                    value="{{ listing.expiry_at.strftime('%Y-%m-%dT%H:%M') }}"
                >
            </div>

            <div class="field full-width">
                <label for="pickup_address">Pickup Address *</label>
                <input
                    id="pickup_address"
                    name="pickup_address"
                    required
                    maxlength="255"
                    value="{{ listing.pickup_address }}"
                >
            </div>

            <div class="field">
                <label for="city">City *</label>
                <input
                    id="city"
                    name="city"
                    required
                    maxlength="100"
                    value="{{ listing.city }}"
                >
            </div>

            <div class="field">
                <label for="description">Food Description</label>
                <textarea id="description" name="description" rows="2">{{ listing.description or '' }}</textarea>
            </div>

            <div class="field full-width">
                <label for="handling_notes">Handling Instructions</label>
                <textarea id="handling_notes" name="handling_notes" rows="2">{{ listing.handling_notes or '' }}</textarea>
            </div>

            <div class="field full-width" style="display: flex; gap: 10px; margin-top: 12px;">
                <button type="submit" class="btn btn-primary">Update Listing</button>
                <a href="{{ url_for('donations') }}" class="btn btn-secondary">Cancel</a>
            </div>

        </div>
    </form>
</section>
{% endblock %}
