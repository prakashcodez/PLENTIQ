<section class="push-notification-controls panel" data-push-notifications aria-labelledby="browser-alerts-title">
  <div>
    <h2 id="browser-alerts-title">Browser notifications</h2>
    <p>Get a pop-up when a nearby donation or food need is posted, and when a request changes.</p>
    <p class="push-notification-status" data-push-status role="status" aria-live="polite">Checking browser notification setup…</p>
  </div>
  <div class="push-notification-actions">
    <button class="button button-primary" type="button" data-push-enable>Enable alerts on this device</button>
    <button class="button button-outline" type="button" data-push-disable hidden>Disable alerts on this device</button>
  </div>
</section>
